<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#11161B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="王手将棋">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>王手将棋オンライン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: 縦1画面。上から 相手(時計・持ち駒) / 盤 / 自分(持ち駒・時計) / 操作・結果 */
:root {
  --bg: #E6EAEC;
  --panel: #F3F5F6;
  --ink: #14181D;
  --ink2: #55616B;
  --line: #C3CBD1;
  --accent: #C0341D;
  --board: #E2B45E;
  --board-line: #4B3612;
  --piece: #F6E5B4;
  --piece-edge: #B58A3C;
  --piece-ink: #1B160E;
  --pro: #B3261E;
  --hl: rgba(192, 52, 29, .24);
  --f-disp: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  --f-ui: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161B; --panel: #1A2128; --ink: #E9EDEF; --ink2: #93A0AA; --line: #2A343D;
    --accent: #EA6048; --board: #BA8B3F; --board-line: #2B1E08; --hl: rgba(234, 96, 72, .30);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161B; --panel: #1A2128; --ink: #E9EDEF; --ink2: #93A0AA; --line: #2A343D;
  --accent: #EA6048; --board: #BA8B3F; --board-line: #2B1E08; --hl: rgba(234, 96, 72, .30);
  color-scheme: dark;
}
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input { -webkit-user-select: text; user-select: text; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  --bs: max(260px, min(calc(100vw - 32px - 36px), calc(100dvh - 300px), 480px));
  --cs: calc(var(--bs) / 9);
  width: 100%; max-width: 520px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.top { width: calc(var(--bs) + 36px); display: flex; align-items: center; justify-content: space-between; }
.brand { font: 800 17px var(--f-disp); letter-spacing: .08em; }
.brand b { color: var(--accent); font-weight: 800; }
.icon-btn { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; font: 700 14px var(--f-ui); color: var(--ink2); }

.strip { width: var(--bs); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.who { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.who .side { font: 800 15px var(--f-disp); }
.who .name { font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock {
  font: 700 22px var(--f-ui); font-variant-numeric: tabular-nums; letter-spacing: .02em;
  padding: 2px 12px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink2);
  min-width: 82px; text-align: center;
}
.clock.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.clock.low.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.hand { width: var(--bs); height: calc(var(--cs) * .92); display: flex; align-items: center; gap: calc(var(--cs) * .08); }
.hand.empty::after { content: '持ち駒なし'; font-size: 11px; color: var(--ink2); letter-spacing: .1em; }
.hd { position: relative; width: calc(var(--cs) * .8); height: calc(var(--cs) * .86); display: grid; place-items: center; border-radius: 4px; }
.hd.sel { background: var(--hl); outline: 2px solid var(--accent); outline-offset: -1px; }
.hd[disabled] { cursor: default; }
.hd i { position: absolute; right: -2px; bottom: -3px; font: 700 11px var(--f-ui); font-style: normal; background: var(--ink); color: var(--bg); border-radius: 8px; min-width: 15px; height: 15px; display: grid; place-items: center; padding: 0 3px; }

.bwrap { display: grid; grid-template-columns: 18px var(--bs) 18px; grid-template-rows: 18px var(--bs); }
.files, .ranks { display: flex; font: 600 11px var(--f-ui); color: var(--ink2); }
.files { grid-column: 2; grid-row: 1; }
.files span { flex: 1; text-align: center; align-self: center; }
.ranks { grid-column: 3; grid-row: 2; flex-direction: column; }
.ranks span { flex: 1; display: grid; align-items: center; padding-left: 4px; font-family: var(--f-disp); font-size: 12px; }
.board {
  grid-column: 2; grid-row: 2; position: relative;
  display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr);
  background: var(--board); border: 2px solid var(--board-line); border-radius: 2px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .22);
  background-image: repeating-linear-gradient(92deg, rgba(90, 55, 10, .05) 0 2px, rgba(255, 235, 170, .05) 2px 5px);
}
.cell { position: relative; display: grid; place-items: center; box-shadow: inset -1px -1px 0 var(--board-line); }
.cell.last { background: var(--hl); }
.cell.sel { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--hl); }
.cell.tgt::after { content: ''; position: absolute; width: 26%; height: 26%; border-radius: 50%; background: var(--board-line); opacity: .5; pointer-events: none; }
.cell.cap::after { width: 84%; height: 84%; background: none; border: 3px solid var(--accent); opacity: .9; }
.cell.ko { background: var(--accent); }
.star { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--board-line); pointer-events: none; }

.pc { display: block; width: calc(var(--cs) * .84); height: calc(var(--cs) * .9); filter: drop-shadow(0 1px 1.5px rgba(30, 18, 0, .45)); pointer-events: none; }
.hd .pc { width: calc(var(--cs) * .74); height: calc(var(--cs) * .8); }
.pc.rot { transform: rotate(180deg); }
.pb {
  display: grid; place-items: center; width: 100%; height: 100%;
  clip-path: polygon(50% 0, 83% 15%, 95% 100%, 5% 100%, 17% 15%);
  background: linear-gradient(160deg, #FBEFC8, var(--piece) 45%, #E8CF8E);
  color: var(--piece-ink); font: 800 calc(var(--cs) * .5) / 1 var(--f-disp);
  padding-top: 18%; box-sizing: border-box;
}
.hd .pb { font-size: calc(var(--cs) * .44); }
.pc.pro .pb { color: var(--pro); }

.panel { width: var(--bs); min-height: 78px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.status { font-size: 13px; color: var(--ink2); text-align: center; min-height: 20px; }
.status b { color: var(--ink); }
.row { display: flex; gap: 8px; }
.btn { flex: 1; height: 42px; border: 1px solid var(--line); border-radius: 8px; font-weight: 700; font-size: 14px; background: var(--panel); }
.btn.pri { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.warn { border-color: var(--accent); color: var(--accent); }
.result { text-align: center; display: grid; gap: 2px; }
.result .big { font: 800 30px var(--f-disp); letter-spacing: .1em; }
.result .big.win { color: var(--accent); }
.result .sub { font-size: 13px; color: var(--ink2); }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-items: center; background: rgba(8, 12, 16, .55); padding: 16px; }
.sheet { box-sizing: border-box; width: min(100%, 380px); background: var(--panel); border-radius: 14px; padding: 22px 20px; display: grid; gap: 14px; max-height: 90dvh; overflow: auto; }
.sheet h2 { font: 800 22px var(--f-disp); letter-spacing: .06em; }
.sheet p, .sheet li { font-size: 13.5px; line-height: 1.75; color: var(--ink2); }
.sheet ul { padding-left: 1.2em; display: grid; gap: 4px; }
.menu .logo { font: 800 56px/1 var(--f-disp); letter-spacing: .12em; color: var(--accent); }
.menu .logo small { display: block; font-size: 17px; letter-spacing: .3em; color: var(--ink); margin-top: 8px; }
.menu .meta { display: flex; gap: 8px; flex-wrap: wrap; }
.menu .meta span { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink); }
.menu .btns { display: grid; gap: 8px; }
.menu .btn { height: 48px; font-size: 15px; }
.menu .rate { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 0; }
.menu .rate > span { font-size: 12px; color: var(--ink2); letter-spacing: .06em; }
.menu .rate b { font: 800 28px var(--f-disp); font-variant-numeric: tabular-nums; margin-right: 8px; }
.menu .rate i { font-style: normal; font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.menu .lab { font-size: 12px; color: var(--ink2); letter-spacing: .08em; }
.lv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lv button { border: 1px solid var(--line); border-radius: 8px; padding: 7px 0 6px; display: grid; gap: 1px; justify-items: center; background: var(--panel); font-size: 13px; font-weight: 700; }
.lv button small { font-size: 10.5px; font-weight: 400; color: var(--ink2); font-variant-numeric: tabular-nums; }
.lv button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lv button.on small { color: inherit; opacity: .8; }
.result .delta { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }
.menu .rates { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 0; }
.menu .rates div { display: grid; gap: 0; min-width: 0; }
.menu .rates span { font-size: 11px; color: var(--ink2); letter-spacing: .06em; }
.menu .rates b { font: 800 26px/1.2 var(--f-disp); font-variant-numeric: tabular-nums; }
.menu .rates i { font-style: normal; font-size: 11px; color: var(--ink2); }
.nickrow { display: flex; align-items: center; gap: 10px; }
.nickrow label { font-size: 12px; color: var(--ink2); letter-spacing: .06em; white-space: nowrap; }
.nickrow input { flex: 1; min-width: 0; box-sizing: border-box; font: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
.rank { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.rank li { display: grid; grid-template-columns: 2.2em 1fr auto auto; gap: 8px; align-items: baseline; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--ink); }
.rank li.me { background: var(--hl); border-radius: 6px; }
.rank .pos { font: 800 15px var(--f-disp); color: var(--ink2); text-align: right; }
.rank .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .rt { font: 800 16px var(--f-disp); }
.rank .gm { font-size: 11px; color: var(--ink2); }
.note { font-size: 12px; line-height: 1.6; color: var(--ink2); }
.spin { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 4px auto; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: sp 1s linear infinite; } }
@keyframes sp { to { transform: rotate(360deg); } }
.promo { width: min(100%, 300px); text-align: center; }
.promo .row { gap: 12px; }
.promo .btn { height: auto; padding: 12px 6px; display: grid; gap: 6px; place-items: center; }
.promo .pc { width: 54px; height: 58px; --cs: 66px; }
.promo .pb { font-size: 33px; }

@media (prefers-reduced-motion: no-preference) {
  .pc { transition: transform .15s; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="top">
    <div class="brand"><b>王手</b>将棋オンライン</div>
    <button class="icon-btn" id="btn-rules" aria-label="ルール">？</button>
  </div>

  <div class="strip" id="strip-top"></div>
  <div class="hand" id="hand-top"></div>

  <div class="bwrap">
    <div class="files" id="files"></div>
    <div class="board" id="board"></div>
    <div class="ranks" id="ranks"></div>
  </div>

  <div class="hand" id="hand-bot"></div>
  <div class="strip" id="strip-bot"></div>

  <div class="panel" id="panel"></div>
</div>

<div class="overlay" id="menu">
  <div class="sheet menu">
    <div class="logo">王手<small>将棋オンライン</small></div>
    <div class="meta"><span>王手将棋</span><span>持ち時間 3分</span><span>切れ負け</span></div>
    <div class="rates">
      <div><span>CPU戦レート</span><b id="rt-val">1000</b><i id="rt-meta"></i></div>
      <div><span>オンラインレート</span><b id="rt-on">-</b><i id="rt-on-meta"></i></div>
    </div>
    <div class="nickrow"><label for="nick">ニックネーム</label><input id="nick" maxlength="12" placeholder="名無し" autocomplete="off"></div>
    <div class="lab">CPUの強さ</div>
    <div class="lv" id="lv"></div>
    <div class="btns">
      <button class="btn pri" data-mode="cpu0">CPUと対戦(先手)</button>
      <button class="btn" data-mode="cpu1">CPUと対戦(後手)</button>
      <button class="btn" data-mode="2p">2人で対戦(1台を交互に・レートなし)</button>
      <button class="btn" id="btn-online" data-mode="online" disabled>オンライン対戦(接続中…)</button>
      <button class="btn" id="btn-rank" disabled>ランキング</button>
    </div>
    <p class="note" id="online-note"></p>
  </div>
</div>

<div class="overlay" id="rules" hidden>
  <div class="sheet">
    <h2>ルール</h2>
    <ul>
      <li>先に相手の玉へ王手をかけた方の勝ちです。詰みは必要ありません。</li>
      <li>自分の玉が取られる位置へ動く手(王手を受ける手)は指せません。</li>
      <li>駒の動き、成り、持ち駒、二歩と行き所のない駒の禁止は通常の将棋と同じです。</li>
      <li>打ち歩詰めも王手なので指せます。</li>
      <li>持ち時間は各3分。切れたら負けです。</li>
      <li>同じ局面が4回で引き分けです。</li>
    </ul>
    <button class="btn pri" id="rules-close" style="height:44px">閉じる</button>
  </div>
</div>

<div class="overlay" id="search" hidden>
  <div class="sheet" style="text-align:center">
    <h2>対戦相手を探しています</h2>
    <div class="spin" aria-hidden="true"></div>
    <p id="search-info"></p>
    <button class="btn" id="search-cancel" style="height:44px">やめる</button>
  </div>
</div>

<div class="overlay" id="rank" hidden>
  <div class="sheet">
    <h2>ランキング</h2>
    <p class="note" id="rank-note">読み込み中…</p>
    <ol class="rank" id="rank-list"></ol>
    <button class="btn pri" id="rank-close" style="height:44px">閉じる</button>
  </div>
</div>

<div class="overlay" id="promo" hidden></div>

<script src="engine.js"></script>
<script src="cpu.js"></script>
<script src="app.js"></script>
</body>
</html>
